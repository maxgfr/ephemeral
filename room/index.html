<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ephemeral room</title>
<meta name="description" content="A live room for talks: reactions, polls and Q&amp;A, peer to peer. Nothing is stored.">
<meta name="theme-color" content="#0b1420" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#edf1f6" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1826'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23f2ad3d' opacity='.9'/%3E%3C/svg%3E">
<link rel="preload" href="../core/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../core/tokens.css">
<link rel="stylesheet" href="room.css">
<script>
  // Apply the saved theme before first paint.
  try { const t = localStorage.getItem('ephemeral-theme'); if (t) document.documentElement.dataset.theme = t } catch {}
</script>
</head>
<body>
<div id="app" class="app">
  <p class="boot">Opening the room…</p>
</div>
<noscript><p class="boot">The room runs entirely in your browser and needs JavaScript.</p></noscript>
<script type="module" src="main.js"></script>
</body>
</html>
